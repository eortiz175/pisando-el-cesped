<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisando el Cesped</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* [All your existing CSS remains exactly the same] */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow-x: hidden;
            background-color: #000;
            font-size: 15px;
        }

        /* [All other CSS remains exactly the same...] */
        /* ... */
        
    </style>
</head>
<body>
    <!-- [All your existing HTML structure remains exactly the same] -->
    <!-- ... -->

    <script>
        let player;
        let isMuted = true;
        const START_TIME = 80;
        let autoplayAttempted = false;
        let autoplaySuccessful = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubeBackground', {
                videoId: 'gX-SQe1FIo8',
                playerVars: {
                    'autoplay': 1,
                    'mute': 0,
                    'loop': 1,
                    'playlist': 'gX-SQe1FIo8',
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'start': START_TIME
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("YouTube player ready, attempting autoplay...");
            autoplayAttempted = true;
            
            try {
                event.target.seekTo(START_TIME, true);
                event.target.playVideo();
                isMuted = false;
                updateSoundButton();
                
                setTimeout(checkAutoplayStatus, 1000);
                
            } catch (error) {
                console.log("Autoplay attempt failed:", error);
                showPlayOverlay();
            }
        }

        function onPlayerStateChange(event) {
            console.log("Player state changed:", event.data);
            
            if (event.data === YT.PlayerState.PLAYING && !autoplaySuccessful) {
                autoplaySuccessful = true;
                console.log("Autoplay successful!");
                
                setTimeout(() => {
                    document.getElementById('playOverlay').classList.remove('active');
                }, 500);
            }
            
            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(START_TIME, true);
                player.playVideo();
            }
        }

        function checkAutoplayStatus() {
            if (player && player.getPlayerState() !== YT.PlayerState.PLAYING && !autoplaySuccessful) {
                console.log("Autoplay appears to have been blocked");
                showPlayOverlay();
            }
        }

        function showPlayOverlay() {
            document.getElementById('playOverlay').classList.add('active');
        }

        function startVideo() {
            if (player) {
                document.getElementById('playOverlay').classList.remove('active');
                player.seekTo(START_TIME, true);
                player.playVideo();
                
                try {
                    player.unMute();
                    player.setVolume(100);
                    isMuted = false;
                    updateSoundButton();
                } catch (error) {
                    console.log("Could not unmute:", error);
                }
            }
        }

        function updateSoundButton() {
            const soundToggle = document.getElementById('soundToggle');
            if (isMuted) {
                soundToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else {
                soundToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
        }

        function toggleSound() {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                if (isMuted) {
                    player.unMute();
                    player.setVolume(100);
                    isMuted = false;
                } else {
                    player.mute();
                    isMuted = true;
                }
                updateSoundButton();
            }
        }

        // FIXED LANGUAGE TOGGLE FUNCTION
        function toggleLanguage() {
            const languageToggle = document.getElementById('languageToggle');
            const toggleText = languageToggle.querySelector('span');
            
            // Get all elements with language classes
            const spanishElements = document.querySelectorAll('.language-es');
            const englishElements = document.querySelectorAll('.language-en');
            
            if (toggleText.textContent === 'English') {
                // Switching TO English
                toggleText.textContent = 'Español';
                
                // Hide all Spanish elements
                spanishElements.forEach(el => {
                    el.style.display = 'none';
                });
                
                // Show all English elements
                englishElements.forEach(el => {
                    el.style.display = '';
                    
                    // Special handling for buttons to maintain flex display
                    if (el.classList.contains('cta-btn')) {
                        el.style.display = 'flex';
                    }
                });
                
            } else {
                // Switching TO Spanish
                toggleText.textContent = 'English';
                
                // Hide all English elements
                englishElements.forEach(el => {
                    el.style.display = 'none';
                });
                
                // Show all Spanish elements
                spanishElements.forEach(el => {
                    el.style.display = '';
                    
                    // Special handling for buttons to maintain flex display
                    if (el.classList.contains('cta-btn')) {
                        el.style.display = 'flex';
                    }
                });
            }
            
            // Update member names after language change
            setMemberNames();
        }

        // [Your existing GitHub configuration remains the same]
        const githubConfig = {
            username: 'YOUR_GITHUB_USERNAME',
            repo: 'YOUR_REPOSITORY_NAME',
            branch: 'main',
            folderPath: 'band-photos',
            photos: {
                member1: 'jorge-chino-ramos.jpg',
                member2: 'adrian-cardenas.jpg',
                member3: 'noriko-mendez.jpg',
                member4: 'carlos-caldero.jpg',
                member5: 'emmanuel-ortiz.jpg'
            },
            names: {
                spanish: {
                    member1: 'Jorge "Chino" Ramos',
                    member2: 'Adrian Cardenas',
                    member3: 'Noriko Mendez',
                    member4: 'Carlos Caldero',
                    member5: 'Emmanuel Ortiz'
                },
                english: {
                    member1: 'Jorge "Chino" Ramos',
                    member2: 'Adrian Cardenas',
                    member3: 'Noriko Mendez',
                    member4: 'Carlos Caldero',
                    member5: 'Emmanuel Ortiz'
                }
            }
        };

        function getGitHubPhotoUrl(filename) {
            if (!filename) return null;
            return `https://raw.githubusercontent.com/${githubConfig.username}/${githubConfig.repo}/${githubConfig.branch}/${githubConfig.folderPath}/${filename}`;
        }

        function loadBandPhotos() {
            console.log('Loading band photos from GitHub...');
            
            for (let i = 1; i <= 5; i++) {
                const memberId = `member${i}`;
                const photoFilename = githubConfig.photos[memberId];
                
                if (photoFilename) {
                    const photoUrl = getGitHubPhotoUrl(photoFilename);
                    console.log(`Loading ${memberId}: ${photoUrl}`);
                    
                    if (photoUrl) {
                        setMemberPhoto(memberId, photoUrl);
                    }
                }
            }
            
            setMemberNames();
        }

        function setMemberPhoto(memberId, photoUrl) {
            const memberCard = document.getElementById(memberId);
            if (!memberCard) return;
            
            const icon = memberCard.querySelector('.member-icon');
            const photo = memberCard.querySelector('.member-photo');
            
            if (!photo) return;
            
            const img = new Image();
            img.onload = function() {
                photo.src = photoUrl;
                photo.style.display = 'block';
                photo.alt = githubConfig.names.spanish[memberId] || 'Band Member';
                if (icon) icon.style.display = 'none';
            };
            img.onerror = function() {
                console.error(`Failed to load photo for ${memberId}: ${photoUrl}`);
                photo.style.display = 'none';
                if (icon) icon.style.display = 'block';
            };
            img.src = photoUrl;
        }

        function setMemberNames() {
            const currentLang = document.getElementById('languageToggle').querySelector('span').textContent;
            const isSpanish = currentLang === 'Español';
            
            for (let i = 1; i <= 5; i++) {
                const memberId = `member${i}`;
                const nameElement = document.getElementById(`${memberId}-name`);
                
                if (nameElement) {
                    const nameData = isSpanish ? 
                        githubConfig.names.spanish[memberId] : 
                        githubConfig.names.english[memberId];
                    
                    if (nameData) {
                        nameElement.textContent = nameData;
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const playButton = document.getElementById('playButton');
            const soundToggle = document.getElementById('soundToggle');
            const playOverlay = document.getElementById('playOverlay');
            const languageToggle = document.getElementById('languageToggle');

            playButton.addEventListener('click', startVideo);
            
            playOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    startVideo();
                }
            });

            soundToggle.addEventListener('click', toggleSound);
            languageToggle.addEventListener('click', toggleLanguage);

            const memberCards = document.querySelectorAll('.member-card');
            memberCards.forEach(card => {
                card.addEventListener('click', function() {
                    const currentLang = document.getElementById('languageToggle').querySelector('span').textContent;
                    const memberId = this.id;
                    const memberName = githubConfig.names.spanish[memberId];
                    
                    if (currentLang === 'Español') {
                        alert(`${memberName}\nHaz clic en "Escuchar Ahora" para conocer nuestra música.`);
                    } else {
                        alert(`${memberName}\nClick "Listen Now" to hear our music.`);
                    }
                });
            });

            const ctaButtons = document.querySelectorAll('.cta-btn');
            ctaButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const currentLang = document.getElementById('languageToggle').querySelector('span').textContent;
                    const action = this.textContent.trim();
                    
                    if (currentLang === 'Español') {
                        alert(`Próximamente podrás ${action.toLowerCase()}. ¡Síguenos en redes sociales para estar al tanto!`);
                    } else {
                        alert(`Coming soon: ${action.toLowerCase()}. Follow us on social media for updates!`);
                    }
                });
            });

            document.addEventListener('click', function() {
                if (!autoplaySuccessful && autoplayAttempted) {
                    startVideo();
                }
            });

            setTimeout(() => {
                if (!autoplaySuccessful && autoplayAttempted) {
                    startVideo();
                }
            }, 2000);
            
            loadBandPhotos();
        });
    </script>
</body>
</html>
